<script>
// 機能⑦ 終わり方の分類 × 忘却
// 機能⑥ 主導権交代 × 会話分岐（ASK_MODE）
// ここもフェーズ0・1の区画には触れず、足すだけ。

// ─────────────────────────────────────────────────────────────
// 機能⑦ 終わり方の分類 × 忘却
// 終わり方が記憶の寿命を決める。放置したものは自然に薄れ、宙吊りのものだけ残る。
// ─────────────────────────────────────────────────────────────
const Memory = (() => {
  const DAY = 86400000;
  const LABEL = { resolved:'片付いた', deferred:'保留', derailed:'脱線', exhausted:'力尽き' };

  const SYS = `あなたは会話の終わり方を見分ける分類器です。

次の4つから1つ選ぶ:
 resolved  = 用が済んで終わった。結論が出た、答えが得られた。
 deferred  = 結論を出さずに意図的に後回しにした。「また今度」「一旦保留」。
 derailed  = 本題から逸れたまま終わった。雑談に流れた、別の話に移った。
 exhausted = 力尽きた。噛み合わないまま、疲れて、投げ出して終わった。

title は会話全体を20文字以内の1行で表す（体言止め、記号を使わない）。

迷ったら deferred を選ぶ。deferred は忘れられずに残るので、
判断を誤って何かを消してしまうより、残しておくほうが害が少ない。

出力（JSONのみ）:
{"endKind":"deferred","title":"予算の増額と会場の検討"}`;

  Queue.def('classify_ending', async (p, signal) => {
    const cur = Session.current;
    if (!cur) return;
    const hist = Chat.history.slice(-CFG.history.apiContext);
    if (hist.length < 2) return;
    const convo = hist.map(m => (m.role === 'user' ? 'ユーザー: ' : 'ボット: ') + m.content)
                      .join('\n').slice(-6000);
    const out = await LLM.callLLM({ system:SYS, messages:[{ role:'user', content:convo }],
                                    expectJson:true, model:CFG.llm.taskModel, signal });
    // 分類できなくても「終わった」ことは記録する。既定は deferred（消えないほう）。
    cur.endKind = LABEL[out?.endKind] ? out.endKind : 'deferred';
    cur.title   = String(out?.title || '').trim().slice(0, 40) || null;
    cur.endedAt = Date.now();
    try { await Store.put('sessions', cur); } catch {}
  });

  // idle:t4（15分）とタブ離脱で「終わった」とみなす
  Bus.on('idle:t4', () => queueClassify());
  Bus.on('visibility:hidden', () => queueClassify());
  function queueClassify() {
    if (!Modules.on('memory')) return;
    Queue.add('classify_ending', {}, { interruptible:false, dedupeKey:'classify_ending' });
  }

  // 終わったと判定した後で会話が続いたら、終了の印を取り消す。
  Bus.on('input:submit', () => {
    const cur = Session.current;
    if (!cur || !cur.endedAt) return;
    cur.endedAt = null; cur.endKind = null;
    Store.put('sessions', cur).catch(() => {});
  });

  // weight = exp(-Δt / tau)。参照されると lastTouchedAt が動いて回復する（想起による強化）。
  function weightOf(s, nowMs) {
    const tau = CFG.decay.tau[s.endKind];
    if (tau === undefined) return 1;
    if (!isFinite(tau)) return 1;                       // deferred は薄れない
    const days = Math.max(0, ((nowMs ?? Date.now()) - (s.lastTouchedAt || s.endedAt || 0)) / DAY);
    return Math.exp(-days / tau);
  }

  async function recall(id) {
    try {
      const s = await Store.get('sessions', id);
      if (!s || s.forgottenAt) return null;
      s.lastTouchedAt = Date.now();
      await Store.put('sessions', s);
      return s;
    } catch { return null; }
  }

  // 物理削除ではなく tombstone に落とす。何があったかの跡だけ残す。
  async function forget(id) {
    let s = null;
    try { s = await Store.get('sessions', id); } catch {}
    if (!s) return false;
    for (const [store, idx] of [['messages','sessionId'], ['facts','sessionId'],
                                ['pendings','sessionId'], ['inputEvents','sessionId'],
                                ['branches','sessionId'], ['ghosts','sessionId']]) {
      try { for (const r of await Store.query(store, idx, { only:id })) await Store.del(store, r.id); }
      catch {}
    }
    try { await Store.put('sessions', { id, endKind: s.endKind || null, forgottenAt: Date.now() }); }
    catch { return false; }
    return true;
  }

  async function render() {
    const el = document.getElementById('memBody');
    if (!el) return;
    let list = [];
    try { list = await Store.query('sessions'); } catch {}
    const now = Date.now();
    list = list.filter(s => s.id !== Session.id())
               .sort((a,b) => (b.lastTouchedAt || b.forgottenAt || 0) - (a.lastTouchedAt || a.forgottenAt || 0));
    if (!list.length) {
      el.innerHTML = '<div class="empty">まだ過去の会話がありません。<br>'
                   + '終わり方によって、薄れる速さが変わります。</div>';
      return;
    }
    el.innerHTML = '';
    for (const s of list) {
      const d = document.createElement('div');
      if (s.forgottenAt) {
        d.className = 'ses tomb';
        d.innerHTML = `<div class="t">忘れました</div><div class="m">`
                    + `<b>${UI.esc(LABEL[s.endKind] || '—')}</b>`
                    + `${new Date(s.forgottenAt).toLocaleDateString('ja-JP')} に忘却</div>`;
        el.appendChild(d); continue;
      }
      const w = weightOf(s, now);
      const dim = s.endKind ? Math.max(.2, Math.min(1, .25 + .75 * w)) : 1;
      d.className = 'ses e-' + (s.endKind || 'none') + (w < CFG.decay.forgetThreshold ? ' fading' : '');
      d.style.opacity = dim.toFixed(2);
      let h = `<div class="t">${UI.esc(s.title || '（題のない会話）')}</div>`
            + `<div class="m"><b>${UI.esc(LABEL[s.endKind] || 'まだ終わっていない')}</b>`
            + `${new Date(s.lastTouchedAt || s.startedAt || 0).toLocaleString('ja-JP',
                 {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}`
            + `<span>濃さ ${Math.round(w * 100)}%</span></div>`
            + `<div class="bar"><i style="width:${Math.round(w * 100)}%"></i></div>`;
      if (s.endKind && w < CFG.decay.forgetThreshold)
        h += `<div class="ask">これ、忘れていいですか`
           + `<button class="yes" data-forget="${s.id}">忘れる</button>`
           + `<button class="no"  data-keep="${s.id}">残す</button></div>`;
      d.innerHTML = h;
      d.addEventListener('click', async (ev) => {
        const fid = ev.target.getAttribute?.('data-forget');
        const kid = ev.target.getAttribute?.('data-keep');
        if (fid) { ev.stopPropagation(); if (await forget(Number(fid))) UI.toast('忘れました'); await render(); return; }
        if (kid) { ev.stopPropagation(); await recall(Number(kid)); UI.toast('残しました。思い出したぶん濃くなります'); await render(); return; }
        await recall(s.id); await render();     // 参照＝想起。開くたびに少し濃くなる。
      });
      el.appendChild(d);
    }
  }

  function open()  { document.getElementById('mem')?.classList.add('on'); render(); }
  function close() { document.getElementById('mem')?.classList.remove('on'); }

  return { render, open, close, weightOf, forget, recall, LABEL };
})();

// ─────────────────────────────────────────────────────────────
// 機能⑥ 主導権交代 × 会話分岐（ASK_MODE）
// 全消しが続くのは「言語化に失敗している」サイン。そこでボットが質問側に回る。
// 本流のログを質問攻めで汚さないため、やりとりは枝に逃がして最後に1つに畳む。
// ─────────────────────────────────────────────────────────────
const Ask = (() => {
  let clears = [];            // 全消しの時刻
  let active = false, branchId = null, parentId = null, qCount = 0;
  let qa = [];                // [{q, a}]
  let card = null, lastMainId = null;

  const SYS_Q = `相手は書こうとして全部消す、を何度も繰り返しています。
言いたいことがまだ言葉になっていない状態です。あなたが質問する側に回ってください。

規則:
・1回に1問だけ。短く。
・必ず選択肢を出す（自由記述だけを求めると、相手はさらに詰まります）。
・選択肢は2〜4個。それぞれ20文字以内。相手の状況を言い当てにいく。
・最後の選択肢は必ず「どれでもない」系の逃げ道にする。
・詰問しない。責めない。「なぜ」で始めない。
・これまでの会話に沿った質問にする。一般論を聞かない。

出力（JSONのみ）:
{"question":"いま詰まっているのは、どのあたりですか","choices":["何を聞けばいいか分からない","言葉が見つからない","前提から説明が要る","どれでもない"]}`;

  const SYS_MERGE = `ヒアリングのやりとりを、本人が書いたつもりの1つの文にまとめてください。

規則:
・120文字以内。1〜3文。
・本人の言葉として書く（「〜とのことです」のような伝聞にしない）。
・選ばれなかった選択肢のことは書かない。
・答えから分かること以外を足さない。

出力はまとめた文のみ。前置きも記号も付けない。`;

  // ── 発動条件: windowMs 以内に CLEAR が clearStreak 回、かつその間に送信が無い ──
  Bus.on('input:delete', (e) => {
    if (!e || e.deleteKind !== 'CLEAR') return;
    if (!Modules.on('ask')) return;
    const now = Date.now();
    clears = clears.filter(t => now - t < CFG.askMode.windowMs);
    clears.push(now);
    if (!active && clears.length >= CFG.askMode.clearStreak) { clears = []; enter().catch(() => {}); }
  });
  Bus.on('input:submit', (e) => {
    clears = [];                                  // 送信できたなら詰まっていない
    if (e?.messageId != null) lastMainId = e.messageId;
    if (active) exit('self').catch(() => {});
  });

  async function enter() {
    if (active) return;
    active = true; qCount = 0; qa = []; parentId = lastMainId;
    try {
      branchId = await Store.put('branches', {
        sessionId: Session.id(), kind:'interview', parentId,
        startedAt: Date.now(), endedAt: null, mergedMessageId: null, reason: null,
      });
    } catch { branchId = null; }
    await nextQuestion();
  }

  async function nextQuestion() {
    if (!active) return;
    if (qCount >= CFG.askMode.maxQuestions) { await exit('maxQuestions'); return; }
    const ctx = Chat.history.slice(-8)
      .map(m => (m.role === 'user' ? 'ユーザー: ' : 'ボット: ') + m.content).join('\n');
    const asked = qa.map((x, i) => `Q${i+1}: ${x.q}\nA${i+1}: ${x.a}`).join('\n');
    const out = await LLM.callLLM({
      system: SYS_Q, expectJson: true, model: CFG.llm.taskModel,
      messages: [{ role:'user', content:
        (ctx ? 'これまでの会話:\n' + ctx + '\n\n' : '') +
        (asked ? 'すでに聞いたこと:\n' + asked + '\n\n' : '') + '次の1問を出してください。' }],
    });
    const q = String(out?.question || '').trim();
    const choices = (Array.isArray(out?.choices) ? out.choices : [])
      .map(c => String(c || '').trim()).filter(Boolean).slice(0, 4);
    if (!q || !choices.length) { await exit('unavailable'); return; }   // 作れないなら黙って引く
    qCount++;
    await persist('assistant', q);
    show(q, choices);
  }

  function show(q, choices) {
    hide();
    const log = document.getElementById('log');
    if (!log) return;
    card = document.createElement('div');
    card.className = 'ask-card';
    card.innerHTML = `<div class="lead">聞かせてください</div>`
      + `<div class="q">${UI.esc(q)}</div><div class="ch"></div>`
      + `<div class="foot"><span>${qCount} / ${CFG.askMode.maxQuestions}</span>`
      + `<button data-quit="1">自分で書く</button></div>`;
    const ch = card.querySelector('.ch');
    for (const c of choices) {
      const b = document.createElement('button');
      b.textContent = c;
      b.addEventListener('click', () => answer(q, c));
      ch.appendChild(b);
    }
    card.querySelector('[data-quit]').addEventListener('click', () => { exit('manual').catch(() => {}); });
    log.appendChild(card);
    UI.scroll();
  }
  function hide() { if (card) { card.remove(); card = null; } }

  async function answer(q, a) {
    qa.push({ q, a });
    await persist('user', a);
    hide();
    await nextQuestion();
  }

  async function persist(role, text) {
    try {
      return await Store.put('messages', {
        sessionId: Session.id(), branchId, parentId,
        role, text, sentAt: Date.now(), typedRanges: null, pastedRanges: null, deleteCounts: null,
      });
    } catch { return null; }
  }

  async function exit(reason) {
    if (!active) return;
    active = false;
    hide();
    const pairs = qa.slice();
    qa = [];
    // 畳んでいる途中に次のASK_MODEが始まっても取り違えないよう、枝IDをここで手放す
    const bid = branchId;
    branchId = null;
    if (bid != null) {
      try {
        const b = await Store.get('branches', bid);
        if (b) { b.endedAt = Date.now(); b.reason = reason; await Store.put('branches', b); }
      } catch {}
    }
    if (!pairs.length) return;                         // 何も聞けていないなら本流に何も足さない

    const detail = pairs.map((x, i) => `Q${i+1} ${x.q}\nA${i+1} ${x.a}`).join('\n\n');
    let summary = await LLM.callLLM({
      system: SYS_MERGE, model: CFG.llm.taskModel,
      messages: [{ role:'user', content: detail }],
    });
    summary = String(summary || '').trim();
    if (!summary) summary = pairs.map(x => x.a).join('。');   // LLMが落ちても畳む

    // 本流には1メッセージだけ足す。詳細は折りたたみに逃がす。
    let mid = null;
    try {
      mid = await Store.put('messages', {
        sessionId: Session.id(), branchId: null, parentId,
        role:'user', text: summary, sentAt: Date.now(), fromBranchId: bid,
        typedRanges: null, pastedRanges: null, deleteCounts: null,
      });
    } catch {}
    if (bid != null) {
      try {
        const b = await Store.get('branches', bid);
        if (b) { b.mergedMessageId = mid; await Store.put('branches', b); }
      } catch {}
    }
    try { Chat.history.push({ role:'user', content: summary }); } catch {}

    const log = document.getElementById('log');
    if (log) {
      const box = document.createElement('div');
      box.className = 'merged';
      box.dataset.branch = String(bid ?? '');
      box.innerHTML = `<h5>聞き取りの結果</h5><div class="sum">${UI.esc(summary)}</div>`
        + `<details><summary>やりとり ${pairs.length}問</summary>`
        + `<div class="qa">${UI.esc(detail)}</div></details>`;
      log.appendChild(box);
      UI.scroll();
    }
  }

  return { enter, exit, get active(){ return active; }, get asked(){ return qCount; },
           _clears(){ return clears.length; } };
})();

// フェーズ2の起動処理。
const Phase2 = { boot() {
  document.getElementById('btnMem')?.addEventListener('click', () => Memory.open());
  document.getElementById('memClose')?.addEventListener('click', () => Memory.close());
  document.getElementById('mem')?.addEventListener('click', (e) => {
    if (e.target.id === 'mem') Memory.close();     // 外側をタップして閉じる
  });
} };
</script>

<!-- ===== S7 FEATURES / Phase 3 追加 ===== -->
<script>
// プライバシーUI（フェーズ3の前提条件）
// 機能② 打鍵停滞 × 黙る監視者
// 機能⑤ 未送信下書き回収 × 同じ轍
//
// 方針: ここで扱うのは全機能で最も機微なデータ。記録は Privacy.isOn() の間だけ行い、
// OFF の間は保存もバッファもしない。LLM に渡すのは抽象化した結果だけで、
// 打鍵ログ・未送信テキストの生データは一切外に出さない。
// このため「同じ轍」のクラスタリングは埋め込みAPIを使わず、端末内の語の重なりで行う。

// ── 語の切り出し ───────────────────────────────────────────────
// 助詞・記号・数字を落として normToken に正規化する。
const Tok = (() => {
  const seg = (typeof Intl !== 'undefined' && Intl.Segmenter)
    ? new Intl.Segmenter('ja', { granularity:'word' }) : null;
  const STOP = new Set(['これ','それ','あれ','この','その','あの','ここ','そこ','どこ',
    'こと','もの','ため','よう','です','ます','した','する','ある','いる','なる','思う',
    'ちょっと','やっぱり','たぶん','けど','でも','ので','から','という','あと','まあ']);

  function words(text) {
    const s = String(text || '');
    if (!s) return [];
    let raw;
    if (seg) raw = [...seg.segment(s)].filter(x => x.isWordLike).map(x => x.segment);
    else raw = s.split(/[\s、。,.!?！？「」（）()\[\]]+/);
    const out = [];
    for (const w of raw) {
      const t = w.normalize('NFKC').toLowerCase().trim();
      if (!t) continue;
      if (/^\d+$/.test(t)) continue;                       // 数字
      if (/^[^\p{L}\p{N}]+$/u.test(t)) continue;           // 記号のみ
      if (/^[ぁ-ん]{1,2}$/.test(t)) continue;              // 助詞・短いひらがな
      if (t.length < 2 && !/[一-鿿]/.test(t)) continue;
      if (STOP.has(t)) continue;
      out.push(t);
    }
    return out;
  }
  const first = (text) => words(text)[0] || null;
  function jaccard(a, b) {
    if (!a.size || !b.size) return 0;
    let inter = 0;
    for (const x of a) if (b.has(x)) inter++;
    return inter / (a.size + b.size - inter);
  }
  return { words, first, jaccard };
})();

// ─────────────────────────────────────────────────────────────
// 機能② 打鍵停滞 × 黙る監視者
// 平均と標準偏差は使わない。1回の長考で基準が壊れるため、median と MAD で見る。
// ─────────────────────────────────────────────────────────────
const Observer = (() => {
  let gaps = [];               // セッション内の打鍵間隔（ローリング）
  let budget = CFG.budget.observerPerSession;
  let pending = null;          // 停滞を検知した位置。直後の語を拾うために持つ。
  let timer = null;

  const median = (a) => {
    if (!a.length) return 0;
    const s = [...a].sort((x,y) => x - y), m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
  };
  function robustZ(v) {
    const med = median(gaps);
    const mad = median(gaps.map(x => Math.abs(x - med)));
    if (!mad) return 0;                                   // ばらつきが無いなら判定しない
    return 0.6745 * (v - med) / mad;
  }

  Bus.on('input:keystroke', (rec) => {
    if (!rec || typeof rec.gap !== 'number') return;
    if (!Modules.on('observer')) return;
    const gap = rec.gap;
    // 60秒超は「停滞」ではなく電話・離席・中断。標本にも入れない。
    if (gap >= CFG.hesitation.ignoreOverMs) return;
    if (gaps.length >= CFG.hesitation.minSamples && robustZ(gap) > CFG.hesitation.zThreshold) {
      schedule(rec.caret ?? 0, gap);
    }
    gaps.push(gap);
    if (gaps.length > 400) gaps.splice(0, gaps.length - 400);
  });
  Bus.on('input:submit', () => { pending = null; clearTimeout(timer); });

  // 詰まった直後に打たれた語が出そろうのを待ってから拾う
  function schedule(caret, gap) {
    pending = { caret, gap };
    clearTimeout(timer);
    timer = setTimeout(() => { capture().catch(() => {}); }, 1500);
  }

  async function capture() {
    const p = pending; pending = null;
    if (!p || !Privacy.isOn()) return;                    // OFF の間は記録しない
    const el = document.getElementById('input');
    if (!el) return;
    const from = Math.max(0, p.caret - 1);
    const token = Tok.first(el.value.slice(from, from + 14));
    if (!token) return;
    try {
      await Store.put('hesitations', { sessionId: Session.id(), normToken: token,
                                       gap: p.gap, ts: Date.now() });
    } catch { return; }
    await maybeSpeak(token);
  }

  // 黙っているほうが既定。喋る条件を全部満たしたときだけ1度だけ口を開く。
  async function maybeSpeak(token) {
    if (budget <= 0) return;
    let rows = [];
    try { rows = await Store.query('hesitations', 'normToken', { only: token }); } catch { return; }
    if (rows.length < CFG.observer.repeatThreshold) return;
    const sessions = new Set(rows.map(r => r.sessionId));
    if (sessions.size < CFG.observer.minSessions) return; // 1セッション内の連発では喋らない
    budget--;
    const log = document.getElementById('log');
    if (!log) return;
    const d = document.createElement('div');
    d.className = 'quiet';
    d.innerHTML = `「<b>${UI.esc(token)}</b>」、毎回ここで止まりますね。`;
    log.appendChild(d);
    UI.scroll();
    Bus.emit('observer:spoke', { token, count: rows.length });
  }

  return { maybeSpeak, _reset(){ gaps = []; budget = CFG.budget.observerPerSession; },
           get samples(){ return gaps.length; }, get budget(){ return budget; },
           _feed(v){ gaps.push(v); }, _z: robustZ };
})();

// ─────────────────────────────────────────────────────────────
// 機能⑤ 未送信下書き回収 × 同じ轍
// 書いたのに送らずに消えたテキストを ghost として拾い、
// 2件以上が同じクラスタに落ちたときだけ「触れられない論点」として一度だけ触れる。
// ─────────────────────────────────────────────────────────────
const Ghosts = (() => {
  let budget = CFG.budget.ghostRecallPerSession;
  let lastGhostId = null;

  async function save(text, killKind) {
    if (!Modules.on('ghosts')) return null;
    if (!Privacy.isOn()) return null;                     // OFF ならバッファにも持たない
    const t = String(text || '').trim();
    if (t.length < CFG.telemetry.ghostMinLen) return null;
    const clusterId = await assignCluster(t);
    try {
      lastGhostId = await Store.put('ghosts', {
        sessionId: Session.id(), text: t, killedAt: Date.now(),
        killKind, followedBy: null, shown: false, clusterId,
      });
      return lastGhostId;
    } catch { return null; }
  }

  // 端末内クラスタリング。語の重なりが閾値を超えた既存 ghost に相乗りする。
  async function assignCluster(text) {
    const mine = new Set(Tok.words(text));
    if (!mine.size) return 'c' + Date.now();
    let all = [];
    try { all = await Store.query('ghosts'); } catch {}
    let best = null, bestScore = 0;
    for (const g of all) {
      const s = Tok.jaccard(mine, new Set(Tok.words(g.text)));
      if (s > bestScore) { bestScore = s; best = g; }
    }
    if (best && bestScore >= CFG.observer.jaccard && best.clusterId) return best.clusterId;
    return 'c' + Date.now() + '-' + Math.floor(performance.now() * 1000 % 100000);
  }

  // 全消し → cleared
  Bus.on('input:delete', (rec) => {
    if (!rec || rec.deleteKind !== 'CLEAR') return;
    const el = document.getElementById('input');
    if (el) save(el.value, 'cleared');
  });

  // 選択したまま別の内容を入れた → overwritten
  function watchOverwrite(el) {
    el.addEventListener('beforeinput', (e) => {
      if (!e.inputType || e.inputType.startsWith('delete')) return;
      const s = el.selectionStart, t = el.selectionEnd;
      if (t - s < CFG.telemetry.ghostMinLen) return;
      save(el.value.slice(s, t), 'overwritten');
    });
  }

  // 書いたまま放置してセッションが終わった → abandoned
  function abandon() {
    const el = document.getElementById('input');
    if (el && el.value.trim().length >= CFG.telemetry.ghostMinLen) save(el.value, 'abandoned');
  }
  Bus.on('visibility:hidden', abandon);
  Bus.on('idle:t4', abandon);

  // 消したあとで実際に送った文を紐づける
  Bus.on('input:submit', async (e) => {
    if (lastGhostId == null || !e?.text) return;
    const id = lastGhostId; lastGhostId = null;
    try {
      const g = await Store.get('ghosts', id);
      if (g && !g.followedBy) { g.followedBy = String(e.text).slice(0, 200); await Store.put('ghosts', g); }
    } catch {}
  });

  // 提示は idle:t3 かつ話が一段落したとき。書いた直後には絶対に出さない。
  Bus.on('idle:t3', () => { recall().catch(() => {}); });

  async function recall() {
    if (!Modules.on('ghosts')) return;
    if (budget <= 0 || !Privacy.isOn()) return;
    if (Chat.busy || Ask.active) return;                  // 話の途中には割り込まない
    const el = document.getElementById('input');
    if (el && el.value.trim()) return;                    // 書きかけの最中にも出さない
    let all = [];
    try { all = await Store.query('ghosts'); } catch { return; }
    const byCluster = new Map();
    for (const g of all) {
      if (!g.clusterId) continue;
      (byCluster.get(g.clusterId) ?? byCluster.set(g.clusterId, []).get(g.clusterId)).push(g);
    }
    // 単発の ghost には触れない。2件以上そろって初めて「同じ轍」になる。
    let target = null;
    for (const [, gs] of byCluster) {
      if (gs.length < CFG.observer.clusterMin) continue;
      if (gs.every(g => g.shown)) continue;
      if (!target || gs.length > target.length) target = gs;
    }
    if (!target) return;
    budget--;
    for (const g of target) { g.shown = true; try { await Store.put('ghosts', g); } catch {} }
    show(target);
  }

  function show(gs) {
    const log = document.getElementById('log');
    if (!log) return;
    const latest = [...gs].sort((a,b) => b.killedAt - a.killedAt)[0];
    const d = document.createElement('div');
    d.className = 'quiet';
    d.innerHTML = `同じことを、${gs.length}回書いて消しています。`
                + `<button class="more">読み返す</button>`;
    d.querySelector('.more').addEventListener('click', function () {
      this.remove();
      const f = document.createElement('div');
      f.className = 'full';
      f.textContent = gs.map(g => g.text).join('\n\n— — —\n\n');
      d.appendChild(f);
      UI.scroll();
    });
    log.appendChild(d);
    UI.scroll();
    Bus.emit('ghost:recalled', { clusterId: latest?.clusterId, n: gs.length });
  }

  return { save, recall, watchOverwrite, assignCluster,
           _reset(){ budget = CFG.budget.ghostRecallPerSession; },
           get budget(){ return budget; } };
})();

// ─────────────────────────────────────────────────────────────
// 記録の中身（プライバシーUI）
// 何を持っているかを全部見せて、種類ごとに消せるようにする。
// ─────────────────────────────────────────────────────────────
const DataPanel = (() => {
  const KILL = { cleared:'全消し', overwritten:'上書き', abandoned:'書いたまま放置' };

  async function counts() {
    const c = {};
    for (const n of ['inputEvents','ghosts','hesitations','messages','facts','pendings','sessions'])
      { try { c[n] = (await Store.query(n)).length; } catch { c[n] = 0; } }
    return c;
  }

  async function render() {
    const el = document.getElementById('privBody');
    if (!el) return;
    const c = await counts();
    const on = Privacy.isOn();
    el.innerHTML =
      `<div class="cnt">いまの状態: <b>${on ? '● 記録 ON' : '記録 OFF'}</b></div>` +
      `<p class="note">記録しているのはこの端末のブラウザの中だけです。`
      + `AIに渡すのは要約した結果だけで、打鍵ログと未送信テキストそのものは送っていません。</p>` +
      `<h3>いま持っているもの</h3>` +
      `<div class="cnt">打鍵ログ ${c.inputEvents}件 / 消した下書き ${c.ghosts}件 / `
      + `詰まった語 ${c.hesitations}件 / 発言 ${c.messages}件</div>` +
      `<h3>消す</h3>` +
      `<div class="row">` +
      `<button data-wipe="keys">打鍵ログだけ消す</button>` +
      `<button data-wipe="ghosts">消した下書きだけ消す</button>` +
      `<button class="danger" data-wipe="all">全部消す</button></div>` +
      `<h3>持ち出す</h3>` +
      `<div class="row"><button data-export="1">JSONで書き出す</button></div>` +
      `<h3>消した下書き ${c.ghosts}件</h3>` +
      `<div id="ghostList"></div>`;

    el.querySelectorAll('[data-wipe]').forEach(b =>
      b.addEventListener('click', () => wipe(b.getAttribute('data-wipe'))));
    el.querySelector('[data-export]')?.addEventListener('click', exportJson);
    await renderGhosts();
  }

  async function renderGhosts() {
    const box = document.getElementById('ghostList');
    if (!box) return;
    let gs = [];
    try { gs = await Store.query('ghosts'); } catch {}
    gs.sort((a,b) => (b.killedAt || 0) - (a.killedAt || 0));
    if (!gs.length) { box.innerHTML = '<div class="empty">まだ何もありません。</div>'; return; }
    box.innerHTML = '';
    for (const g of gs) {
      const d = document.createElement('div');
      d.className = 'ghost';
      d.innerHTML = `<div class="g">${UI.esc(g.text)}</div><div class="m">`
        + `<b>${UI.esc(KILL[g.killKind] || g.killKind || '—')}</b>`
        + `${new Date(g.killedAt || 0).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}`
        + `<span class="spacer"></span><button data-del="${g.id}">消す</button></div>`;
      d.querySelector('[data-del]').addEventListener('click', async () => {
        try { await Store.del('ghosts', g.id); } catch {}
        await render();
      });
      box.appendChild(d);
    }
  }

  async function wipe(kind) {
    const label = { keys:'打鍵ログ', ghosts:'消した下書き', all:'記録した全部' }[kind] || '';
    if (!confirm(`${label}を消します。元に戻せません。\n\nよろしいですか？`)) return;
    const targets = kind === 'keys'   ? ['inputEvents']
                  : kind === 'ghosts' ? ['ghosts']
                  : ['inputEvents','ghosts','hesitations','messages','facts',
                     'pendings','branches','sessions','tasks','kv'];
    for (const t of targets) { try { await Store.clearStore(t); } catch {} }
    if (kind === 'all') { try { Chat.history.length = 0; } catch {}
                          document.getElementById('log')?.replaceChildren();
                          await Session.start(); await Facts.render(); }
    UI.toast(`${label}を消しました`);
    Bus.emit('privacy:wiped', { kind });
    await render();
  }

  async function exportJson() {
    try {
      const data = await Store.exportAll();
      const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)],
                                               { type:'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = 'ghostchat-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      UI.toast('書き出しました');
    } catch (e) { UI.toastErr('書き出せませんでした: ' + (e?.message || '')); }
  }

  function open()  { document.getElementById('priv')?.classList.add('on'); render(); }
  function close() { document.getElementById('priv')?.classList.remove('on'); }

  return { render, open, close, wipe, counts };
})();

// フェーズ3の起動処理。
const Phase3 = { boot() {
  const el = document.getElementById('input');
  if (el) Ghosts.watchOverwrite(el);
  document.getElementById('btnData')?.addEventListener('click', () => DataPanel.open());
  document.getElementById('privClose')?.addEventListener('click', () => DataPanel.close());
  document.getElementById('priv')?.addEventListener('click', (e) => {
    if (e.target.id === 'priv') DataPanel.close();
  });
  Bus.on('privacy:changed', () => {
    if (document.getElementById('priv')?.classList.contains('on')) DataPanel.render();
  });
} };
</script>

<!-- ===== S7 FEATURES / Phase 4 追加 ===== -->
<script>
// プリセット（モジュールのON/OFF組み合わせ）と、ここで初めて実装する2つ:
//   A-2 自己批判 …… 無入力中に直前の回答を見直し、穴があれば自分から訂正する
//   2回目は別角度 … 同じ趣旨の質問には、前回と違う切り口でしか答えない
// 遅延の演出（C-1）は採用しない。訂正は idle:t2 以降に裏で走らせるだけにする。

const Modules = (() => {
  const KEY = 'ghostchat_modules';
  const ALL = {
    facts:    ['確定事項ペイン',        '手打ちで決めたことを右に積む'],
    returns:  ['おかえり要約と未解決キュー','離席から戻ったとき経緯と宿題を出す'],
    memory:   ['終わり方の分類と忘却',   '終わり方に応じて記憶が薄れる'],
    ask:      ['主導権交代',            '書けずに消し続けると聞き役に回る'],
    observer: ['黙る監視者',            '同じ語で何度も詰まったときだけ言う'],
    ghosts:   ['消した下書きの回収',     '送らずに消した内容の繰り返しに触れる'],
    critique: ['自己批判と自己訂正',     '無入力中に直前の回答を見直して訂正する'],
    angle:    ['2回目は別角度',         '同じ質問には違う切り口でしか答えない'],
  };
  const PRESETS = {
    full: ['全部入り', '既定。すべての機能を動かす',
           Object.keys(ALL)],
    p8:   ['⑧ 時間差の同席者', '速いときは短く、止まれば長考。普段は黙り、宿題は覚えている',
           ['returns','critique','observer']],
    p9:   ['⑨ 言えなかったことの記録装置', '表と裏の2本のログが並走する',
           ['ghosts','ask']],
    p10:  ['⑩ 決着させる装置', '雑談ではなく判断のための道具',
           ['facts','angle','memory','returns']],
  };

  let state = null;
  function load() {
    if (state) return state;
    try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch {}
    if (!state || typeof state !== 'object') state = {};
    for (const k of Object.keys(ALL)) if (typeof state[k] !== 'boolean') state[k] = true;
    return state;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(load())); } catch {}
    Bus.emit('modules:changed', { ...load() });
  }
  const on = (k) => load()[k] !== false;
  function set(k, v) { if (k in ALL) { load()[k] = !!v; save(); } }
  function apply(preset) {
    const p = PRESETS[preset]; if (!p) return;
    const s = load();
    for (const k of Object.keys(ALL)) s[k] = p[2].includes(k);
    save();
  }
  function currentPreset() {
    const s = load();
    for (const [id, p] of Object.entries(PRESETS)) {
      if (Object.keys(ALL).every(k => (s[k] === true) === p[2].includes(k))) return id;
    }
    return null;
  }
  return { on, set, apply, currentPreset, ALL, PRESETS, all: load };
})();

// ─────────────────────────────────────────────────────────────
// A-2 自己批判 × 自己訂正
// 無入力中に直前の回答を読み直し、穴があれば自分から訂正を差し込む。
// 「特に問題なし」を言わせないこと。黙るのが既定。
// ─────────────────────────────────────────────────────────────
const Critique = (() => {
  let lastChecked = -1;                 // 直近で見直した assistant 発言の位置
  let budgetTurn = null;                // 同じ発言を二度は見直さない

  const SYS = `あなたは自分が直前に返した回答を、時間を置いてから読み直しています。
読み直す目的は、間違いや抜けを自分で見つけて直すことです。

flawed を true にしてよいのは、次のどれかがあるときだけです:
・事実として誤っている
・質問の条件を1つ以上取りこぼしている
・成り立たない前提を置いている
・重要な例外や副作用に触れていない

次のようなものは flawed にしない:
・言い回しをもっと丁寧にできる
・もっと詳しく書ける
・一般論として補足できることがある
迷ったら flawed は false にしてください。黙っているほうが既定です。

fix は訂正の本文。120文字以内。前置きも謝罪もなく、直す内容だけを書く。

出力（JSONのみ）:
{"flawed":false,"fix":""}`;

  Queue.def('self_critique', async (p, signal) => {
    const h = Chat.history;
    const i = h.length - 1;
    if (i < 1 || h[i].role !== 'assistant') return;
    const q = [...h].slice(0, i).reverse().find(m => m.role === 'user');
    if (!q) return;
    const out = await LLM.callLLM({
      system: SYS, expectJson: true, model: CFG.llm.model, signal,
      messages: [{ role:'user', content:
        `質問:\n${q.content}\n\nあなたの回答:\n${h[i].content}\n\n読み直してください。` }],
    });
    if (!out || out.flawed !== true) return;
    const fix = String(out.fix || '').trim();
    if (!fix) return;
    // ユーザーが次を打ち始めていたら差し込まない（割り込みになる）
    const el = document.getElementById('input');
    if (el && el.value.trim()) return;
    show(fix);
    try { h.push({ role:'assistant', content:'（訂正）' + fix }); } catch {}
    Bus.emit('critique:fixed', { fix });
  });

  function show(fix) {
    const log = document.getElementById('log');
    if (!log) return;
    const d = document.createElement('div');
    d.className = 'fix';
    d.innerHTML = `<h5>さっきの回答を訂正します</h5><div class="b"></div>`;
    d.querySelector('.b').textContent = fix;
    log.appendChild(d);
    UI.scroll();
  }

  Bus.on('idle:t2', () => {
    if (!Modules.on('critique')) return;
    const h = Chat.history;
    const i = h.length - 1;
    if (i < 1 || h[i].role !== 'assistant') return;
    if (budgetTurn === i) return;                    // 同じ回答は一度しか見直さない
    budgetTurn = i; lastChecked = i;
    Queue.add('self_critique', {}, { interruptible:true, dedupeKey:'self_critique' });
  });
  Bus.on('input:submit', () => { budgetTurn = null; });

  return { show, get lastChecked(){ return lastChecked; },
           _reset(){ budgetTurn = null; lastChecked = -1; } };
})();

// ─────────────────────────────────────────────────────────────
// 2回目は別角度
// 同じ趣旨の質問を検出したら、その回だけシステム制約を差し込む。
// Chat には手を入れず、履歴に system 行を1本挿して次の送信に効かせる。
// ─────────────────────────────────────────────────────────────
const Angle = (() => {
  let asked = [];             // [{text, tokens:Set}]
  let injected = null;        // 直前に差し込んだ制約（次の送信で外す）

  function ruleFor(prev) {
    return `【この回の制約】このユーザーは以前にも同じ趣旨のことを聞いています`
         + `（前回:「${prev.slice(0, 60)}」）。\n`
         + `前回の回答と同じ切り口で答えないでください。前回触れた観点は繰り返さず、`
         + `別の角度からのみ答えること。前置きで「前にも聞かれましたね」と言う必要はありません。`;
  }

  Bus.on('input:submit', (e) => {
    const h = Chat.history;
    // 前の回に差し込んだ制約が残っていれば外す（1回きりの制約なので持ち越さない）
    if (injected) {
      const at = h.indexOf(injected);
      if (at >= 0) h.splice(at, 1);
      injected = null;
    }
    const text = String(e?.text || '').trim();
    if (!text) return;
    const tokens = new Set(Tok.words(text));

    if (Modules.on('angle') && tokens.size) {
      let hit = null, best = 0;
      for (const a of asked) {
        const s = Tok.jaccard(tokens, a.tokens);
        if (s > best) { best = s; hit = a; }
      }
      if (hit && best >= CFG.repeat.jaccard) {
        injected = { role:'system', content: ruleFor(hit.text) };
        // いま積まれた user 行の直前に挿す（この送信のペイロードに間に合う）
        const at = h.length - 1;
        if (at >= 0 && h[at].role === 'user') h.splice(at, 0, injected);
        else { h.push(injected); }
        Bus.emit('angle:applied', { prev: hit.text, score: best });
      }
    }
    asked.push({ text, tokens });
    if (asked.length > 50) asked.shift();
  });

  return { get injected(){ return injected; }, get asked(){ return asked.length; },
           _reset(){ asked = []; injected = null; } };
})();

// ─────────────────────────────────────────────────────────────
// 構成パネル
// ─────────────────────────────────────────────────────────────
const ModPanel = (() => {
  function render() {
    const el = document.getElementById('modsBody');
    if (!el) return;
    const cur = Modules.currentPreset();
    el.innerHTML = '<h3>プリセット</h3><div id="presets"></div>'
                 + '<h3>ひとつずつ</h3><div id="modlist"></div>'
                 + '<p class="note" style="font-size:11.5px;color:var(--faint);line-height:1.8;margin-top:12px">'
                 + '全部切っても、普通のチャットとしては変わらず動きます。</p>';
    const ps = el.querySelector('#presets');
    for (const [id, p] of Object.entries(Modules.PRESETS)) {
      const b = document.createElement('button');
      b.className = 'preset' + (cur === id ? ' on' : '');
      b.innerHTML = `<div class="n">${UI.esc(p[0])}</div><div class="d">${UI.esc(p[1])}</div>`;
      b.addEventListener('click', () => { Modules.apply(id); render(); UI.toast(p[0] + 'にしました'); });
      ps.appendChild(b);
    }
    const ml = el.querySelector('#modlist');
    for (const [k, v] of Object.entries(Modules.ALL)) {
      const d = document.createElement('div');
      d.className = 'mod' + (Modules.on(k) ? ' on' : '');
      d.innerHTML = `<div class="sw"></div><div class="t">${UI.esc(v[0])}`
                  + `<div style="font-size:11px;color:var(--faint)">${UI.esc(v[1])}</div></div>`;
      d.addEventListener('click', () => { Modules.set(k, !Modules.on(k)); render(); });
      ml.appendChild(d);
    }
  }
  function open()  { document.getElementById('mods')?.classList.add('on'); render(); }
  function close() { document.getElementById('mods')?.classList.remove('on'); }
  return { render, open, close };
})();

// フェーズ4の起動処理。
const Phase4 = { boot() {
  document.getElementById('btnMods')?.addEventListener('click', () => ModPanel.open());
  document.getElementById('modsClose')?.addEventListener('click', () => ModPanel.close());
  document.getElementById('mods')?.addEventListener('click', (e) => {
    if (e.target.id === 'mods') ModPanel.close();
  });
} };
</script>

<!-- ===== S8 UI ===== -->
<script>
const UI = (() => {
  const $ = (id) => document.getElementById(id);
  let logEl, inputEl, sendEl, toastEl, toastTimer;

  function esc(s){ return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function addMsg(role, text) {
    const row = document.createElement('div');
    row.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    row.innerHTML = `<div class="who">${role==='user'?'you':'gc'}</div><div class="body"></div>`;
    const body = row.querySelector('.body');
    body.textContent = text;
    logEl.appendChild(row);
    trim(); scroll();
    return body;
  }
  function addSys(text) {
    const row = document.createElement('div');
    row.className = 'msg sys'; row.textContent = text;
    logEl.appendChild(row); trim(); scroll(); return row;
  }
  function setMsg(body, text) { body.textContent = text; scroll(); }
  function trim() { while (logEl.children.length > CFG.ui.maxLogNodes) logEl.firstChild.remove(); }
  function scroll() { logEl.scrollTop = logEl.scrollHeight; }

  function toast(msg, ms) {
    if (!toastEl) return;
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms || CFG.ui.toastMs);
  }
  const toastErr = (m) => toast(m, CFG.ui.errToastMs);

  function setBusy(b) { sendEl.disabled = b; }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
  }

  function submit() {
    const text = inputEl.value;
    if (!text.trim() || Chat.busy) return;
    const snap = Tele.snapshotForSend();
    inputEl.value = ''; autoGrow();
    Tele.flush('submit');
    Chat.send(text, snap);
  }

  function boot() {
    logEl = $('log'); inputEl = $('input'); sendEl = $('send'); toastEl = $('toast');
    sendEl.addEventListener('click', submit);
    inputEl.addEventListener('input', autoGrow);
    inputEl.addEventListener('keydown', (e) => {
      // IME変換中の Enter は確定であって送信ではない
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !Tele.composing) {
        e.preventDefault(); submit();
      }
    });
    $('btnPane').addEventListener('click', () => $('pane').classList.toggle('hidden'));
    Tele.attach(inputEl);
    Idle.arm();
    $('hsub').textContent = Store.ready ? '' : '· メモリのみ';
  }

  return { boot, addMsg, addSys, setMsg, toast, toastErr, setBusy, esc, scroll };
})();
function toast(m, ms) { UI.toast(m, ms); }
</script>

<!-- ===== S9 PRIVACY ===== -->
<script>
// インジケータ・削除・エクスポート。Phase 3 の前提条件としてここを先に完成させる。
const Privacy = (() => {
  const isOn = () => { try { return localStorage.getItem(PRIV_KEY) === '1'; } catch { return false; } };
  function set(v) {
    try { localStorage.setItem(PRIV_KEY, v ? '1' : '0'); } catch {}
    render();
    Bus.emit('privacy:changed', { on: v });
  }
  function render() {
    const b = document.getElementById('btnPriv'); if (!b) return;
    const on = isOn();
    b.textContent = on ? '● 記録 ON' : '記録 OFF';
    b.classList.toggle('on', on);
  }
  function toggle() {
    if (isOn()) { set(false); toast('記録を止めました'); return; }
    const ok = confirm(
      '打鍵の記録をオンにします。\n\n' +
      '記録するもの:\n' +
      '・キーを打った/消した/貼った、というイベントと時刻\n' +
      '・書いたのに送らずに消したテキスト\n\n' +
      '・すべてこの端末のブラウザの中だけに保存されます\n' +
      '・外部に送信しません（AIには要約した結果だけを渡します）\n' +
      '・いつでも一覧を見て、消せます\n\nオンにしますか？');
    if (ok) { set(true); toast('記録をオンにしました。ヘッダに●が出ている間だけ記録します'); }
  }
  return { isOn, set, toggle, render };
})();
</script>

<!-- ===== BOOT ===== -->
<script>
(async function boot() {
  const setup = document.getElementById('setup');
  const app   = document.getElementById('app');

  async function start(k) {
    try { localStorage.setItem(API_KEY, k); } catch {}
    setup.style.display = 'none';
    app.style.display = 'flex';
    await Store.init();
    await Session.start();
    UI.boot();
    Privacy.render();
    document.getElementById('btnPriv').addEventListener('click', Privacy.toggle);
    await Queue.recover();
    await Phase1.boot();
    Phase2.boot();
    Phase3.boot();
    Phase4.boot();
    Tele.purgeOld();
    document.getElementById('input').focus();
  }

  let saved = ''; try { saved = localStorage.getItem(API_KEY) || ''; } catch {}
  if (saved) { start(saved); return; }

  const go = () => {
    const k = document.getElementById('keyInput').value.trim();
    if (!k.startsWith('sk-')) { document.getElementById('keyInput').focus(); return; }
    start(k);
  };
  document.getElementById('keyGo').addEventListener('click', go);
  document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
})();
</script>
</body>
</html>
